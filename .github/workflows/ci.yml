name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend including integration tests
        run: mvn -f backend/pom.xml -B -ntp clean verify -Ptest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  backend-quality:
    name: Backend Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Checkstyle
        run: mvn -f backend/pom.xml -B -ntp checkstyle:check
      - name: SpotBugs
        run: mvn -f backend/pom.xml -B -ntp -DskipTests compile spotbugs:spotbugs spotbugs:check

  frontend-test:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (zero warnings allowed)
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8081/api/v1
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  docker-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose syntax
        working-directory: ./infrastructure
        run: docker compose config --quiet
      - name: Check unsafe development exposure
        run: |
          python3 - <<'PYCODE'
          import pathlib, re, sys
          config = pathlib.Path('infrastructure/docker-compose.yml').read_text()
          problems = []
          if re.search(r'POSTGRES_HOST_AUTH_METHOD\s*:\s*["\\\']?trust\b', config):
              problems.append('PostgreSQL trust authentication is forbidden')
          for service, port in [('postgres', '5432'), ('redis', '6379')]:
              section = re.search(rf'^  {service}:\n(.*?)(?=^  [a-z][\w-]*:|^volumes:|\Z)', config, re.M | re.S)
              if not section or not re.search(r'127\.0\.0\.1:.*:' + port + r'\b', section.group(1)):
                  problems.append(f'{service} must publish {port} on 127.0.0.1 only')
          if problems:
              print('\n'.join(problems), file=sys.stderr)
              sys.exit(1)
          print('Compose does not enable trust auth or expose PostgreSQL/Redis publicly')
          PYCODE

  security-scan:
    name: Security Scan (Secrets & IaC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository secrets and misconfigurations
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: 'secret,misconfig'
          severity: 'HIGH,CRITICAL'
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
      - name: Upload scan report
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  validate:
    name: Validate All Checks
    needs: [backend-test, backend-quality, frontend-test, docker-validate, security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Required job results: $RESULTS"
          if [[ "$RESULTS" != "success,success,success,success,success" ]]; then
            echo 'At least one required CI job failed or was skipped'
            exit 1
          fi

  notify:
    name: Notify on Failure
    needs: validate
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo 'CI failed. Review the failed job logs in GitHub Actions.'
